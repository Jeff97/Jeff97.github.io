{% if include.video_ids and include.video_ids.size > 0 %}
<section class="research-videos" aria-label="{{ include.label | escape }}">
  {% for video_id in include.video_ids %}
  {% assign video = site.data.research_videos[video_id] %}
  <figure class="research-video">
    <div class="research-video__media" style="--video-aspect: {{ video.display_width }} / {{ video.display_height }};">
      <video controls playsinline preload="none" width="{{ video.display_width }}" height="{{ video.display_height }}" poster="{{ video.poster | relative_url }}" aria-label="{{ video.title | escape }}">
        <source src="{{ video.src | escape }}" type="video/mp4">
        Your browser does not support embedded video. <a href="{{ video.src | escape }}">Open the MP4 video</a>.
      </video>
      <button class="research-video__play" type="button" aria-label="Play {{ video.title | escape }}" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
        <span>Play video</span>
      </button>
    </div>
    <p class="research-video__status" role="status" hidden>Unable to play here. Please use the Open video link below.</p>
    <figcaption>
      <strong>{{ video.title | escape }}</strong>
      <span>{{ video.caption | escape }}</span>
      <span class="research-video__links">
        {% if video.doi %}<a href="https://doi.org/{{ video.doi }}">{{ video.publication | escape }}</a>{% else %}{{ video.publication | escape }}{% endif %}
        · <a href="{{ video.source | escape }}">GitHub source</a>
        · <a href="{{ video.src | escape }}">Open video</a>
      </span>
    </figcaption>
  </figure>
  {% endfor %}
</section>
{% endif %}
